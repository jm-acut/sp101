
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeClean | Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-private="true">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>

<header>
  <a class="brand" href="index.html">HomeClean</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="my-bookings.html">My Bookings</a>
    <button id="logout-button">Logout</button>
  </nav>
</header>
<main>
  <section class="panel">
    <h1>Request a Cleaning Service</h1>
    <div class="demo-notice">Use fictional details only. This form does not book a real cleaner.</div>
    <p id="message" class="message" role="status" hidden></p>
    <form id="booking-form">
      <label>Service
        <select id="service_id" name="service_id" required>
          <option value="">Loading services...</option>
        </select>
      </label>
      <label>Customer Name
        <input name="customer_name" maxlength="120" required>
      </label>
      <label>Philippine Mobile Number
        <input name="phone" type="tel" placeholder="09171234567" pattern="09[0-9]{9}" required>
      </label>
      <label>Fictional Cleaning Address
        <textarea name="address" maxlength="500" rows="3" required></textarea>
      </label>
      <label>Preferred Date
        <input name="preferred_date" type="date" required>
      </label>
      <label>Preferred Time
        <select name="preferred_time" required>
          <option value="">Choose a time</option>
          <option value="08:00">8:00 AM</option>
          <option value="10:00">10:00 AM</option>
          <option value="13:00">1:00 PM</option>
          <option value="15:00">3:00 PM</option>
        </select>
      </label>
      <label>Additional Notes (Optional)
        <textarea name="notes" maxlength="1000" rows="3"></textarea>
      </label>
      <button type="submit">Save Booking Request</button>
    </form>
    <p><a href="my-bookings.html">View My Bookings</a></p>
  </section>
</main>
<footer>HomeClean | Academic Demo</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
